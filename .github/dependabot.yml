version: 2
updates:
  # The plugins in settings.gradle.kts, gradle/libs.versions.toml and the wrapper. The Minecraft-bound
  # dependencies in stonecutter.properties.toml are updated by hand.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
